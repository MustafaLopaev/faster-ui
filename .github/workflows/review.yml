# Model-driven pull-request review (004 US3, contract: contracts/review-jobs.md),
# on Azure OpenAI chat completions via .github/scripts/model-jobs.mjs.
#
# Four advisory checks. NONE of them can block a merge, and that is structural
# rather than a policy setting: a check whose verdict can be argued with by its
# own input must not be able to gate anything (FR-017). Never add any of these
# job ids to the required-check list.
#
# Injection hardening, four independent measures, weakest last on purpose:
#   1. CAPABILITY  — the model holds NO TOOLS. The script gathers every input
#                    deterministically and performs the one fixed action (post
#                    a sticky comment). No `contents: write` anywhere in this
#                    file. A model that cannot act cannot be talked into acting.
#   2. AUTHORITY   — reference material is read from `base/`, a checkout of the
#                    BASE ref. A change that edits the constitution is judged
#                    *as a change to* the rules, not *by* its own version.
#   3. BLAST RADIUS— advisory only, so a fully successful injection changes a
#                    comment, not a merge decision.
#   4. FRAMING     — the prompt says the diff is untrusted data. This is the one
#                    with a known bypass class, which is why it is listed last.
#
# `pull_request_target` is forbidden (FR-018) — see .github/workflows/README.md.
name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Comment only. No job in this file may gain `contents: write`.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Same shared sets as ci.yml, so a docs-only change wakes nothing here either.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      components: ${{ steps.filter.outputs.components }}
      surface: ${{ steps.surface.outputs.changed }}
      mode: ${{ steps.mode.outputs.mode }}
      demo-file: ${{ steps.mode.outputs.file }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/path-filter
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
      # Demo is the default. Opt into full reviews with the `REVIEW_MODE`
      # repository variable: `gh variable set REVIEW_MODE --body full`
      - id: mode
        env:
          MODE: ${{ vars.REVIEW_MODE }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode="${MODE:-demo}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # Demo mode reviews exactly ONE file — a real review of a real change,
          # just bounded. Prefer shipping source over a spec or a story.
          file="$(git diff --name-only "$BASE" HEAD -- 'src/**' \
                   | grep -vE '\.(test|cy|stories)\.tsx?$' | head -1 || true)"
          [ -n "$file" ] || file="$(git diff --name-only "$BASE" HEAD | head -1 || true)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "::notice title=Review mode::$mode${file:+ — demo target: $file}"

      - id: surface
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
               | grep -qx 'etc/faster-ui.api.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── B1 — the constitution reviewer ────────────────────────────────────────
  constitution-review:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Measure 2. The rules come from the base ref, always.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # The prompt — rules first as a stable cacheable prefix, the volatile
      # diff last — lives in .github/scripts/model-jobs.mjs. Demo mode reviews
      # exactly one file with at most three findings; full mode gets the whole
      # diff, size-capped by the script rather than by a turn budget.
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs constitution-review
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_MODE: ${{ needs.changes.outputs.mode }}
          DEMO_FILE: ${{ needs.changes.outputs.demo-file }}

  # ── B3 — the version-increment classifier ─────────────────────────────────
  semver-classify:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.mode == 'full' &&
      needs.changes.outputs.surface == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # Classifies via the rule table in the script and a JSON-schema verdict
      # ({required, rationale, claimed, agrees}). This job DOES NOT BLOCK — the
      # blocking half is the deterministic `api-surface` gate.
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs semver-classify
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # ── B4 — the token audit ──────────────────────────────────────────────────
  token-audit:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.mode == 'full' &&
      needs.changes.outputs.components == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # The audit definition is read from base/.claude/skills/token-audit/ and
      # applied to the component diff. The mechanical half stays with the regex
      # gates; this catches the token that is valid but MEANS the wrong thing.
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs token-audit
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # ── B5 — story suggestions ────────────────────────────────────────────────
  # DETECTION is deterministic and blocks, in ci.yml's `coverage-gate` job.
  # WRITING the missing story is a judgement call and cannot. That split is the
  # point: `npm run coverage:gate` says a story is missing; this says what it
  # should contain, and is free to be wrong about it.
  coverage-suggest:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.mode == 'full' &&
      needs.changes.outputs.components == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      # The script runs `npm run coverage:gate` itself (and calls the model
      # only when the gate fails), so this job needs the toolchain.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs coverage-suggest
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
