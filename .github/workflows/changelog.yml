# Changelog drafter (004 C3, contract: contracts/scheduled-agents.md).
#
# Opens a PULL REQUEST adding a bullet under `## [Unreleased]`. It never pushes
# to the default branch (FR-034) — `contents: write` exists here solely to
# create a branch, and the job id is on the one-item allowlist in
# scripts/check-workflows.mjs for exactly that reason.
#
# This is load-bearing rather than tidy-minded: release.yml REFUSES to publish a
# version with no changelog section, so the changelog is a release gate, not
# documentation. Drafting it at merge time means the gate is satisfied before
# anyone hits it at tag time.
name: Changelog

on:
  push:
    branches: [main]

concurrency:
  group: changelog
  cancel-in-progress: false # never abandon a half-created branch

permissions:
  contents: read

jobs:
  draft-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # a NEW BRANCH only — never a push to main
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # The model only decides whether the change is consumer-visible and words
      # the one bullet ({qualifies, section, bullet, reason} — JSON schema). The
      # SCRIPT does everything that acts: edits CHANGELOG.md, creates the
      # `changelog/<sha>` branch, pushes it, opens the pull request. It never
      # touches `main`, and "nothing qualifies" — the common case — opens no PR.
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs draft-changelog
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.ok == 'true'
        with:
          name: model-usage-draft-changelog
          path: model-usage.json
          if-no-files-found: ignore
