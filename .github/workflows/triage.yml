# CI failure triage (004 C2, contract: contracts/scheduled-agents.md).
#
# Comments on the associated pull request with a classification. Never blocks,
# never re-runs anything, never touches the code.
#
# Why this is worth a workflow file HERE and would not be in general: this
# repository has four DOCUMENTED flake shapes. An agent that knows them by name
# resolves most red builds without a human opening a log. A generic log
# summariser would not be worth the file.
name: Triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read # read the failed run's logs
  pull-requests: write # comment, and nothing else

jobs:
  triage:
    runs-on: ubuntu-latest
    # Only failures, and only for runs that came from this repository — a
    # fork's run carries no secret and there is nothing to comment on.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/claude-guard
        id: guard
        with:
          api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # The script fetches the failed logs itself (`gh run view --log-failed`),
      # classifies them through Azure OpenAI against the four documented flake
      # patterns (FR-033 — a `known-flake` verdict must name its pattern), and
      # comments on the branch's open pull request when there is one. The model
      # holds no tools; log content is data, never instruction.
      - if: steps.guard.outputs.ok == 'true'
        run: node .github/scripts/model-jobs.mjs triage
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.ok == 'true'
        with:
          name: model-usage-triage
          path: model-usage.json
          if-no-files-found: ignore
