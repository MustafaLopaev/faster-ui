# Release — tag-triggered publication of @mlopaev/faster-ui
# (contract: specs/003-ci-release/contracts/release-workflow.md).
# Publishes ONLY behind the full quality suite, re-run on the tagged commit itself.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The complete gate suite, single-sourced from ci.yml (research R-2) —
  # a gate added to CI later is automatically part of release gating.
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm provenance is signed with
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${manifest_version} — aborting before publish (FR-010)."
            exit 1
          fi

      - name: Verify the changelog documents this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section — every release ships with notes."
            exit 1
          fi

      # `--provenance` publishes a signed, verifiable link from the tarball back
      # to this workflow run and commit. It needs `id-token: write` above.
      # NPM_TOKEN is referenced here and nowhere else — structurally unreachable
      # from PR-triggered runs (FR-012). Public access is declared in package.json#publishConfig.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines between this version's heading and the next one.
          awk -v v="## [${version}]" '
            $0 ~ v {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
